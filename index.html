<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Support Ticketing Tool</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0 0 8px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 15px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .stat h2 {
            margin: 5px 0;
            font-size: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        label {
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        textarea {
            min-height: 100px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .ticket {
            border: 1px solid #d1d5db;
            padding: 18px;
            margin-top: 15px;
            border-radius: 8px;
        }

        .ticket h3 {
            margin-top: 0;
        }

        .ticket select {
            max-width: 250px;
            margin-bottom: 5px;
        }

        .delete-btn {
            background: #dc2626;
            margin-top: 10px;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .ticket-id {
            color: #2563eb;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎫 IT Support Ticketing Tool</h1>
    <p>IT Helpdesk Ticket Management System</p>
</header>

<div class="container">

    <!-- Dashboard -->
    <div class="dashboard">

        <div class="stat">
            <p>Total Tickets</p>
            <h2 id="totalTickets">0</h2>
        </div>

        <div class="stat">
            <p>Open</p>
            <h2 id="openTickets">0</h2>
        </div>

        <div class="stat">
            <p>In Progress</p>
            <h2 id="progressTickets">0</h2>
        </div>

        <div class="stat">
            <p>Resolved</p>
            <h2 id="resolvedTickets">0</h2>
        </div>

    </div>

    <!-- Create Ticket -->
    <div class="card">

        <h2>➕ Create New Ticket</h2>

        <label>Requester Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label>Ticket Title</label>
        <input type="text" id="title" placeholder="Example: Outlook is not working">

        <label>Description</label>
        <textarea id="description"
            placeholder="Describe your IT issue"></textarea>

        <label>Priority</label>
        <select id="priority">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>

        <button onclick="createTicket()">Create Ticket</button>

    </div>

    <!-- Tickets -->
    <div class="card">

        <h2>🎫 Ticket List</h2>

        <div id="ticketList">
            <p>No tickets available.</p>
        </div>

    </div>

</div>

<script>

function createTicket() {

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const title = document.getElementById("title").value.trim();
    const description = document.getElementById("description").value.trim();
    const priority = document.getElementById("priority").value;

    if (!name || !email || !title || !description) {
        alert("Please fill all fields.");
        return;
    }

    const ticket = {

        id: "TKT-" + Math.floor(10000 + Math.random() * 90000),

        name: name,
        email: email,
        title: title,
        description: description,
        priority: priority,

        status: "Open",

        createdAt: new Date().toLocaleString()

    };

    let tickets =
        JSON.parse(localStorage.getItem("tickets")) || [];

    tickets.push(ticket);

    localStorage.setItem(
        "tickets",
        JSON.stringify(tickets)
    );

    alert("Ticket created successfully!");

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("title").value = "";
    document.getElementById("description").value = "";

    displayTickets();

}


function displayTickets() {

    const ticketList =
        document.getElementById("ticketList");

    let tickets =
        JSON.parse(localStorage.getItem("tickets")) || [];

    updateDashboard(tickets);

    if (tickets.length === 0) {

        ticketList.innerHTML =
            "<p>No tickets available.</p>";

        return;
    }

    ticketList.innerHTML = "";

    tickets.forEach(ticket => {

        const ticketDiv =
            document.createElement("div");

        ticketDiv.className = "ticket";

        ticketDiv.innerHTML = `

            <h3>${ticket.title}</h3>

            <p class="ticket-id">
                Ticket ID: ${ticket.id}
            </p>

            <p>
                <strong>Requester:</strong>
                ${ticket.name}
            </p>

            <p>
                <strong>Email:</strong>
                ${ticket.email}
            </p>

            <p>
                <strong>Description:</strong>
                ${ticket.description}
            </p>

            <p>
                <strong>Priority:</strong>
                ${ticket.priority}
            </p>

            <p>
                <strong>Created:</strong>
                ${ticket.createdAt}
            </p>

            <label>Status</label>

            <select onchange="changeStatus('${ticket.id}', this.value)">

                <option value="Open"
                    ${ticket.status === "Open" ? "selected" : ""}>
                    Open
                </option>

                <option value="In Progress"
                    ${ticket.status === "In Progress" ? "selected" : ""}>
                    In Progress
                </option>

                <option value="Resolved"
                    ${ticket.status === "Resolved" ? "selected" : ""}>
                    Resolved
                </option>

            </select>

            <br>

            <button class="delete-btn"
                onclick="deleteTicket('${ticket.id}')">
                Delete Ticket
            </button>

        `;

        ticketList.appendChild(ticketDiv);

    });

}


function changeStatus(id, newStatus) {

    let tickets =
        JSON.parse(localStorage.getItem("tickets")) || [];

    const ticket =
        tickets.find(ticket => ticket.id === id);

    if (ticket) {

        ticket.status = newStatus;

        localStorage.setItem(
            "tickets",
            JSON.stringify(tickets)
        );

        displayTickets();

    }

}


function deleteTicket(id) {

    let tickets =
        JSON.parse(localStorage.getItem("tickets")) || [];

    tickets =
        tickets.filter(ticket => ticket.id !== id);

    localStorage.setItem(
        "tickets",
        JSON.stringify(tickets)
    );

    displayTickets();

}


function updateDashboard(tickets) {

    const total = tickets.length;

    const open =
        tickets.filter(t => t.status === "Open").length;

    const progress =
        tickets.filter(t => t.status === "In Progress").length;

    const resolved =
        tickets.filter(t => t.status === "Resolved").length;

    document.getElementById("totalTickets").textContent = total;

    document.getElementById("openTickets").textContent = open;

    document.getElementById("progressTickets").textContent = progress;

    document.getElementById("resolvedTickets").textContent = resolved;

}


displayTickets();

</script>

</body>
</html>
