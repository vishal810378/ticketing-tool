<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT Helpdesk Ticketing System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        /* HEADER */
        header {
            background: #0f172a;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        header p {
            color: #cbd5e1;
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        /* DASHBOARD */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            text-align: center;
        }

        .stat-card h3 {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 30px;
            font-weight: bold;
        }

        /* CARDS */
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-bottom: 20px;
            color: #0f172a;
        }

        /* FORM */
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        /* BUTTONS */
        button {
            border: none;
            border-radius: 7px;
            padding: 12px 20px;
            font-size: 15px;
            cursor: pointer;
            color: white;
            background: #2563eb;
        }

        button:hover {
            opacity: 0.9;
        }

        .create-btn {
            background: #2563eb;
        }

        .clear-btn {
            background: #64748b;
        }

        .delete-btn {
            background: #dc2626;
            margin-top: 10px;
        }

        /* FILTERS */
        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            align-items: start;
        }

        .filters input,
        .filters select {
            margin-bottom: 0;
        }

        /* TICKETS */
        .ticket {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            background: #ffffff;
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
            margin-bottom: 12px;
        }

        .ticket-title {
            font-size: 19px;
            font-weight: bold;
            color: #0f172a;
        }

        .ticket-id {
            color: #2563eb;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .ticket-info {
            margin: 7px 0;
            line-height: 1.5;
        }

        .priority-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .priority-high {
            background: #fee2e2;
            color: #b91c1c;
        }

        .priority-medium {
            background: #fef3c7;
            color: #92400e;
        }

        .priority-low {
            background: #dcfce7;
            color: #166534;
        }

        .status-section {
            margin-top: 15px;
        }

        .status-section select {
            max-width: 250px;
            margin-top: 8px;
            margin-bottom: 0;
        }

        .no-ticket {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
            font-size: 14px;
        }

        /* MOBILE */
        @media (max-width: 800px) {

            .dashboard {
                grid-template-columns: repeat(2, 1fr);
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .filters input,
            .filters select,
            .filters button {
                width: 100%;
            }

            .ticket-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 500px) {

            header h1 {
                font-size: 24px;
            }

            .dashboard {
                grid-template-columns: 1fr 1fr;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-card .number {
                font-size: 24px;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>🎫 IT Helpdesk Ticketing System</h1>

    <p>IT Support & Ticket Management Portal</p>

</header>


<div class="container">

    <!-- DASHBOARD -->

    <div class="dashboard">

        <div class="stat-card">
            <h3>Total Tickets</h3>
            <div class="number" id="totalTickets">0</div>
        </div>

        <div class="stat-card">
            <h3>Open</h3>
            <div class="number" id="openTickets">0</div>
        </div>

        <div class="stat-card">
            <h3>In Progress</h3>
            <div class="number" id="progressTickets">0</div>
        </div>

        <div class="stat-card">
            <h3>Resolved</h3>
            <div class="number" id="resolvedTickets">0</div>
        </div>

    </div>


    <!-- CREATE TICKET -->

    <div class="card">

        <h2>➕ Create New Ticket</h2>

        <label for="name">Requester Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter requester name">


        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter email address">


        <label for="title">Ticket Title</label>

        <input
            type="text"
            id="title"
            placeholder="Example: Outlook is not working">


        <label for="description">Issue Description</label>

        <textarea
            id="description"
            placeholder="Describe the IT issue"></textarea>


        <label for="priority">Priority</label>

        <select id="priority">

            <option value="Low">Low</option>

            <option value="Medium" selected>Medium</option>

            <option value="High">High</option>

        </select>


        <button
            class="create-btn"
            onclick="createTicket()">

            🎫 Create Ticket

        </button>

    </div>


    <!-- SEARCH AND FILTER -->

    <div class="card">

        <h2>🔍 Search & Filter Tickets</h2>

        <div class="filters">

            <input
                type="text"
                id="search"
                placeholder="Search ticket, title, name, email..."
                oninput="displayTickets()">


            <select
                id="statusFilter"
                onchange="displayTickets()">

                <option value="All">All Status</option>

                <option value="Open">Open</option>

                <option value="In Progress">In Progress</option>

                <option value="Resolved">Resolved</option>

            </select>


            <select
                id="priorityFilter"
                onchange="displayTickets()">

                <option value="All">All Priority</option>

                <option value="Low">Low</option>

                <option value="Medium">Medium</option>

                <option value="High">High</option>

            </select>


            <button
                class="clear-btn"
                onclick="clearFilters()">

                Clear

            </button>

        </div>

    </div>


    <!-- TICKET LIST -->

    <div class="card">

        <h2>🎫 Ticket List</h2>

        <div id="ticketList"></div>

    </div>

</div>


<footer>

    IT Helpdesk Ticketing System | DevOps Portfolio Project

</footer>


<script>

/* =========================
   CREATE TICKET
========================= */

function createTicket() {

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const title =
        document.getElementById("title").value.trim();

    const description =
        document.getElementById("description").value.trim();

    const priority =
        document.getElementById("priority").value;


    if (
        name === "" ||
        email === "" ||
        title === "" ||
        description === ""
    ) {

        alert("Please fill all fields.");

        return;
    }


    const ticket = {

        id:
            "TKT-" +
            Date.now(),

        name: name,

        email: email,

        title: title,

        description: description,

        priority: priority,

        status: "Open",

        createdAt:
            new Date().toLocaleString()

    };


    let tickets =
        JSON.parse(
            localStorage.getItem("tickets")
        ) || [];


    tickets.push(ticket);


    localStorage.setItem(
        "tickets",
        JSON.stringify(tickets)
    );


    alert(
        "Ticket created successfully!\nTicket ID: " +
        ticket.id
    );


    document.getElementById("name").value = "";

    document.getElementById("email").value = "";

    document.getElementById("title").value = "";

    document.getElementById("description").value = "";

    document.getElementById("priority").value = "Medium";


    displayTickets();
}


/* =========================
   DISPLAY TICKETS
========================= */

function displayTickets() {

    const ticketList =
        document.getElementById("ticketList");


    let tickets =
        JSON.parse(
            localStorage.getItem("tickets")
        ) || [];


    updateDashboard(tickets);


    const search =
        document.getElementById("search")
            .value
            .trim()
            .toLowerCase();


    const statusFilter =
        document.getElementById("statusFilter")
            .value;


    const priorityFilter =
        document.getElementById("priorityFilter")
            .value;


    const filteredTickets =
        tickets.filter(function(ticket) {

            const id =
                String(ticket.id || "")
                    .toLowerCase();

            const title =
                String(ticket.title || "")
                    .toLowerCase();

            const name =
                String(ticket.name || "")
                    .toLowerCase();

            const email =
                String(ticket.email || "")
                    .toLowerCase();

            const description =
                String(ticket.description || "")
                    .toLowerCase();


            const matchesSearch =
                search === "" ||
                id.includes(search) ||
                title.includes(search) ||
                name.includes(search) ||
                email.includes(search) ||
                description.includes(search);


            const matchesStatus =
                statusFilter === "All" ||
                ticket.status === statusFilter;


            const matchesPriority =
                priorityFilter === "All" ||
                ticket.priority === priorityFilter;


            return (
                matchesSearch &&
                matchesStatus &&
                matchesPriority
            );

        });


    if (filteredTickets.length === 0) {

        ticketList.innerHTML = `
            <div class="no-ticket">
                🔎 No matching tickets found.
            </div>
        `;

        return;
    }


    ticketList.innerHTML = "";


    filteredTickets
        .slice()
        .reverse()
        .forEach(function(ticket) {

            const ticketDiv =
                document.createElement("div");


            ticketDiv.className = "ticket";


            let priorityClass =
                "priority-medium";


            if (ticket.priority === "High") {

                priorityClass =
                    "priority-high";

            }


            if (ticket.priority === "Low") {

                priorityClass =
                    "priority-low";

            }


            ticketDiv.innerHTML = `

                <div class="ticket-header">

                    <div class="ticket-title">

                        🎫 ${escapeHTML(ticket.title)}

                    </div>

                    <span class="priority-badge ${priorityClass}">

                        ${escapeHTML(ticket.priority)}

                    </span>

                </div>


                <div class="ticket-id">

                    Ticket ID:
                    ${escapeHTML(String(ticket.id))}

                </div>


                <div class="ticket-info">

                    <strong>Requester:</strong>
                    ${escapeHTML(ticket.name)}

                </div>


                <div class="ticket-info">

                    <strong>Email:</strong>
                    ${escapeHTML(ticket.email)}

                </div>


                <div class="ticket-info">

                    <strong>Description:</strong>
                    ${escapeHTML(ticket.description)}

                </div>


                <div class="ticket-info">

                    <strong>Created:</strong>
                    ${escapeHTML(ticket.createdAt)}

                </div>


                <div class="status-section">

                    <label>Status</label>

                    <select
                        onchange="changeStatus(
                            '${escapeHTML(String(ticket.id))}',
                            this.value
                        )">

                        <option
                            value="Open"
                            ${ticket.status === "Open" ? "selected" : ""}>

                            Open

                        </option>


                        <option
                            value="In Progress"
                            ${ticket.status === "In Progress" ? "selected" : ""}>

                            In Progress

                        </option>


                        <option
                            value="Resolved"
                            ${ticket.status === "Resolved" ? "selected" : ""}>

                            Resolved

                        </option>

                    </select>

                </div>


                <button
                    class="delete-btn"
                    onclick="deleteTicket(
                        '${escapeHTML(String(ticket.id))}'
                    )">

                    🗑️ Delete Ticket

                </button>

            `;


            ticketList.appendChild(ticketDiv);

        });

}


/* =========================
   CHANGE STATUS
========================= */

function changeStatus(id, newStatus) {

    let tickets =
        JSON.parse(
            localStorage.getItem("tickets")
        ) || [];


    const ticket =
        tickets.find(function(ticket) {

            return String(ticket.id) === String(id);

        });


    if (ticket) {

        ticket.status = newStatus;


        localStorage.setItem(
            "tickets",
            JSON.stringify(tickets)
        );


        displayTickets();

    }

}


/* =========================
   DELETE TICKET
========================= */

function deleteTicket(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this ticket?"
        );


    if (!confirmDelete) {

        return;

    }


    let tickets =
        JSON.parse(
            localStorage.getItem("tickets")
        ) || [];


    tickets =
        tickets.filter(function(ticket) {

            return String(ticket.id) !== String(id);

        });


    localStorage.setItem(
        "tickets",
        JSON.stringify(tickets)
    );


    displayTickets();

}


/* =========================
   DASHBOARD
========================= */

function updateDashboard(tickets) {

    const total =
        tickets.length;


    const open =
        tickets.filter(function(ticket) {

            return ticket.status === "Open";

        }).length;


    const progress =
        tickets.filter(function(ticket) {

            return ticket.status === "In Progress";

        }).length;


    const resolved =
        tickets.filter(function(ticket) {

            return ticket.status === "Resolved";

        }).length;


    document.getElementById(
        "totalTickets"
    ).textContent = total;


    document.getElementById(
        "openTickets"
    ).textContent = open;


    document.getElementById(
        "progressTickets"
    ).textContent = progress;


    document.getElementById(
        "resolvedTickets"
    ).textContent = resolved;

}


/* =========================
   CLEAR FILTERS
========================= */

function clearFilters() {

    document.getElementById("search").value = "";

    document.getElementById("statusFilter").value = "All";

    document.getElementById("priorityFilter").value = "All";

    displayTickets();

}


/* =========================
   SECURITY
   Prevent HTML injection
========================= */

function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   LOAD TICKETS
========================= */

displayTickets();

</script>

</body>
</html>
